name: App Develop Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy App Develop to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /var/www/app/staging

            git fetch origin
            git switch develop || git switch -c develop origin/develop
            git reset --hard origin/develop

            npm install
            rm -rf dist
            npm run build

            cd backend
            npm install

            pm2 restart app-staging --update-env || pm2 start npm --name app-staging -- start
            pm2 save

            nginx -t
            systemctl reload nginx
