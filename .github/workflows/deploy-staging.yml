name: App Live Deploy

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy App Live to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /var/www/app/live

            echo "Current branch:"
            git branch --show-current

            echo "Fetching latest live branch..."
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git fetch origin live

            git checkout live
            git reset --hard origin/live

            echo "Latest deployed commit:"
            git log -1 --oneline

            echo "Installing frontend dependencies..."
            npm install

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd backend
            npm install

            echo "Restarting backend..."
            pm2 restart app-live || pm2 start npm --name app-live -- start
            pm2 save

            echo "Reloading nginx..."
            nginx -t
            systemctl reload nginx

            echo "LIVE DEPLOYMENT COMPLETE"