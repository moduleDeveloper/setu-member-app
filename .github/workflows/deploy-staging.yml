name: App Live Deploy

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy App Live to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/app/live
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519" git pull origin live

            npm install
            npm run build

            cd backend
            npm install

            pm2 restart app-live || pm2 start npm --name app-live -- start
            pm2 save

            nginx -t
            systemctl reload nginx
